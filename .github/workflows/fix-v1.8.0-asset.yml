name: Fix release asset (one-shot)

# 一次性：把 v1.8.0 Release 里挂错的附件换成该标签自己的真实文件。
# 为什么走 CI 而不是本地：本机没有 gh CLI，而调用 GitHub 写 API 需要读取用户凭据；
# 交给 GitHub 自己的 runner 用 GITHUB_TOKEN 做，既不碰凭据也不用手点网页。
# 用完即删（见 tools/ 之外的下一次提交）。

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/fix-v1.8.0-asset.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要 tag 对象

      - name: 用 v1.8.0 标签里的文件覆盖 Release 附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v1.8.0
          file=auto-pip-mini-player.user.js
          git fetch --tags --force
          echo "--- 标签 $tag 里的文件 ---"
          git show "$tag:$file" > "$file"
          head -6 "$file"
          echo "字节数: $(wc -c < "$file")（应为 66196，即带 CRLF 的原始 1.8.0 内容）"
          grep -m1 '@version' "$file"
          echo "--- 覆盖 Release 附件 ---"
          gh release upload "$tag" "$file" --clobber
          echo "--- 结果 ---"
          gh release view "$tag" --json tagName,name,assets --jq '{tag: .tagName, title: .name, assets: [.assets[] | {name, size}]}'
