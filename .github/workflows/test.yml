name: Test

# 每次推送/PR 都跑一遍冒烟测试（最小 DOM 桩，不需要浏览器）。
# 目的是在改动后立刻发现行为回归 —— 这个脚本的很多逻辑（停靠/还原、几何补偿、
# 防跳补偿、画中画触发与自动收起）都可以在没有浏览器的环境里验证。

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 运行冒烟测试
        run: node test/smoke-test.cjs
